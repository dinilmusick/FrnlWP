name: CI
on: [push,pull_request]
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2'}
      - run: php tools/validate.php
      - run: composer validate --strict
      - run: php tests/frontend-api-events.php
      - run: php tests/ui-surface-asset.php
      - run: node --test tests/ui-surface.test.mjs
